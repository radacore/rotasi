name: flutter_pdf_flipbook
description: Display PDFs as beautiful flipbooks with smooth page-turn animations on mobile, web, and desktop.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  pdfx: ^2.6.0
  http: ^1.1.0

flutter:
  uses-material-design: true
