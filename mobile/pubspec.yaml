name: rotasi_mobile
description: "Aplikasi mobile ROTASI - pemantauan mandiri tekanan darah ibu hamil (offline-first)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.0.0
  http: ^1.6.0
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfx: ^2.9.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  timezone: ^0.10.0
  url_launcher: ^6.3.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2+1
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 800
    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript.ttf
          weight: 400
        - asset: assets/fonts/DancingScript.ttf
          weight: 600
        - asset: assets/fonts/DancingScript.ttf
          weight: 700


flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0C4A6E"
  adaptive_icon_foreground: "assets/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0C4A6E"
  image: assets/logo.png
  android: true
  ios: false
  android_12:
    image: assets/logo.png
    color: "#0C4A6E"
    icon_background_color: "#0C4A6E"
